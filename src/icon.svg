<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Flat fill, and a corner radius of a quarter of the side. Both are taken from
    the favicon at https://managerforcraft.com/favicon.svg, which is a 32x32 with
    rx="8" in #c9331c: same shape language, same red, scaled to this viewBox.

    The gradient and the sheen this carried before are gone on purpose. The mark
    they were approximating is flat, and at the size the Plugin Store actually
    renders an icon a vertical gradient collapses into a muddy single colour
    anyway. Removing them takes the <defs> block with it, and with it the
    id-collision problem that block existed to work around: the Plugin Store lists
    several icons on one page, and duplicate gradient ids had each plugin painted
    in whichever one loaded last.
  -->
  <rect x="0" y="0" width="100" height="100" rx="25" fill="#c9331c"/>
  <!--
    One site reporting outbound to one platform. Deliberately not the fan-out
    the webhook notifier uses: this connector has a single destination, it is
    always the one that speaks first, and nothing ever comes back the other way.
    The arcs are concentric on the site, and that is what carries the direction:
    no arrowhead needed, and no fade either. Fading the outer arcs was tried and
    dropped, because it lost too much contrast and the other plugins in this
    family all use a solid white glyph.
  -->
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round">
    <path d="M32.2 54.4 A20 20 0 0 1 47.6 69.8"/>
    <path d="M34.9 41.7 A33 33 0 0 1 60.3 67.1"/>
    <path d="M37.6 29.0 A46 46 0 0 1 73.0 64.4"/>
  </g>
  <g fill="#ffffff">
    <circle cx="28" cy="74" r="9"/>
    <circle cx="75" cy="27" r="10"/>
  </g>
</svg>
